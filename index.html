<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B6A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sesli Not">
<meta name="mobile-web-app-capable" content="yes">
<title>Sesli Not Kartı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alex+Brush&family=Allura&family=Amatic+SC:wght@700&family=Baloo+2:wght@800&family=Bangers&family=Bebas+Neue&family=Caveat:wght@600&family=Cinzel:wght@700&family=Comfortaa:wght@700&family=Cormorant+Garamond:ital,wght@1,600&family=Courgette&family=Dancing+Script:wght@700&family=Fredoka:wght@600&family=Great+Vibes&family=Kalam:wght@700&family=Kaushan+Script&family=Lobster&family=Marck+Script&family=Merienda:wght@700&family=Monoton&family=Montserrat:wght@800&family=Nunito:wght@400;600;800&family=Pacifico&family=Parisienne&family=Patrick+Hand&family=Pinyon+Script&family=Playfair+Display:ital,wght@1,600&family=Righteous&family=Sacramento&display=swap">
<style>
/* Düzen: üstte canlı kart önizlemesi, altında yazı alanı + büyük mikrofon, kaydırılabilir sekmeler, en altta sabit gönder çubuğu */
:root{
  --accent-l:#0E6B6A; --accent-d:#3FB3B0;
  --bg:#EEF2F1; --surface:#FFFFFF; --fg:#1B2626; --muted:#5E6D6C;
  --line:#D5DEDC; --accent:var(--accent-l); --accent-fg:#FFFFFF; --rec:#D33A3A; --soft:#E2ECEA;
  --ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Pacifico","Dancing Script",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121918;--surface:#1C2524;--fg:#E7EFEE;--muted:#93A4A2;--line:#2E3B3A;--accent:var(--accent-d);--accent-fg:#0B1514;--rec:#F06161;--soft:#243231;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121918;--surface:#1C2524;--fg:#E7EFEE;--muted:#93A4A2;--line:#2E3B3A;--accent:var(--accent-d);--accent-fg:#0B1514;--rec:#F06161;--soft:#243231;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;
  padding:env(safe-area-inset-top,0px) 16px calc(96px + env(safe-area-inset-bottom,0px));}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;color:var(--accent)}
.hbtns{display:flex;gap:6px}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.icon:disabled{opacity:.35;cursor:default}
.icon svg{width:22px;height:22px}

.preview{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;justify-content:center;
  background-image:linear-gradient(45deg,var(--soft) 25%,transparent 25%,transparent 75%,var(--soft) 75%),linear-gradient(45deg,var(--soft) 25%,transparent 25%,transparent 75%,var(--soft) 75%);
  background-size:20px 20px;background-position:0 0,10px 10px}
#card{max-width:100%;max-height:52vh;width:auto;height:auto;border-radius:8px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.15)}

.composer{display:flex;gap:10px;align-items:stretch}
textarea{flex:1;min-width:0;min-height:104px;resize:vertical;font:16px/1.45 var(--ui);color:var(--fg);
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
textarea:focus-visible,button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.mic{width:80px;flex:none;border:none;border-radius:16px;background:var(--accent);color:var(--accent-fg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:800 12px var(--ui);cursor:pointer}
.mic svg{width:30px;height:30px}
.mic.on{background:var(--rec);animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(211,58,58,.5)}70%{box-shadow:0 0 0 14px rgba(211,58,58,0)}100%{box-shadow:0 0 0 0 rgba(211,58,58,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.status{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.link{background:none;border:none;color:var(--accent);font:800 13px var(--ui);cursor:pointer;padding:4px 0}

.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:none;background:none;color:var(--muted);font:800 14px var(--ui);padding:9px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
#panel{display:flex;flex-direction:column;gap:16px;min-height:200px}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.label output{letter-spacing:0;text-transform:none;color:var(--fg);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px}
.sw{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative;display:grid;place-items:center;font:800 11px var(--ui);color:#333}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.sw.auto{background:conic-gradient(#fff 0 50%,#222 0)}
.sw.custom{background:conic-gradient(#f44,#fd3,#4d6,#3ce,#46f,#d4e,#f44)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0}
.sw.custom span{background:rgba(255,255,255,.85);border-radius:50%;width:55%;height:55%;display:grid;place-items:center;font-size:16px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:4px;cursor:pointer;color:var(--fg);
  display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px var(--ui);min-width:0}
.tile canvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:8px;display:block}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fontbtn{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 6px;font-size:22px;cursor:pointer;line-height:1.25;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fontbtn small{display:block;font:600 11px var(--ui);color:var(--muted);margin-top:2px}
.fontbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.sub{font-size:13px;font-weight:800;color:var(--fg);margin:4px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;font:700 13px var(--ui);cursor:pointer;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
input[type=text],input[type=url],input[type=search]{width:100%;min-width:0;font:16px var(--ui);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emojis button{aspect-ratio:1;max-width:100%;font-size:24px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;padding:0}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.pickers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pickers label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.pickers input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:2px;cursor:pointer}
.wide{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px;font:800 14px var(--ui);cursor:pointer;width:100%}
.wide.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.wide.danger{color:var(--rec)}
.note-card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--surface);min-width:0}
.note-card canvas{width:100%;border-radius:8px;display:block;cursor:pointer}
.note-card p{margin:0;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.note-card .row{gap:4px}
.note-card .row button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:700 12px var(--ui);cursor:pointer}
.mini{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:10px 14px;font:800 14px var(--ui);cursor:pointer;flex:none}
.mini.danger{background:var(--surface);color:var(--rec);border-color:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions .mini{background:var(--surface);color:var(--fg);border-color:var(--line);padding:8px 12px;font-size:13px}
.actions .mini.danger{color:var(--rec)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:999px;padding:6px 11px;font:700 13px var(--ui);cursor:pointer}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.res{border:2px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--soft);cursor:pointer;display:flex;flex-direction:column;min-width:0;color:var(--muted);text-align:left}
.res img{width:100%;aspect-ratio:1;max-width:100%;object-fit:cover;display:block}
.res span{font:600 10px var(--ui);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res.loading{opacity:.45;pointer-events:none}
.res:hover{border-color:var(--accent)}
.searchbox{border-top:1px solid var(--line);padding-top:14px}
.layers{display:flex;gap:8px;flex-wrap:wrap}
.layer-chip{width:64px;height:64px;border-radius:12px;border:2px solid var(--line);padding:0;overflow:hidden;background:var(--soft);cursor:pointer}
.layer-chip img{width:100%;height:100%;object-fit:cover;display:block}
.layer-chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.current{display:flex;gap:12px;align-items:center}
.current img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex:none}
.current div{min-width:0}.current .hint{word-break:break-word}
.voice{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.voice audio{flex:1;min-width:180px;height:40px}
.vbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 14px;font:800 13px var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.vbtn i{width:10px;height:10px;border-radius:50%;background:var(--rec);display:inline-block}
.vbtn.rec{background:var(--rec);color:#fff;border-color:var(--rec);font-variant-numeric:tabular-nums}
.vbtn.rec i{background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.vbtn.rec i{animation:none}}
select{font:700 13px var(--ui);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;max-width:100%}
.media-out{display:flex;flex-direction:column;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface)}
.media-out img,.media-out video{max-width:100%;max-height:50vh;border-radius:10px}
.media-out .row{width:100%}.media-out .row button{flex:1}
.progress{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.accents{display:flex;gap:10px;flex-wrap:wrap}
.accents button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.accents button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.bar .inner{max-width:600px;width:100%;display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.btn{border:none;border-radius:14px;padding:14px 8px;font:800 15px var(--ui);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);z-index:20;
  padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sesli Not</h1>
    <div class="hbtns">
      <button class="icon" id="undo" type="button" aria-label="Geri al" title="Geri al"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="icon" id="redo" type="button" aria-label="Yinele" title="Yinele"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="icon" id="random" type="button" aria-label="Rastgele tasarım" title="Rastgele tasarım"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="16" cy="8" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="8" cy="16" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/></svg></button>
    </div>
  </header>

  <div class="preview"><canvas id="card" width="1080" height="1080" aria-label="Not kartı önizlemesi"></canvas></div>

  <div class="composer">
    <textarea id="text" placeholder="Mikrofona dokunup konuşun ya da buraya yazın…"></textarea>
    <button class="mic" id="mic" type="button" aria-label="Sesle yaz">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      <span id="micLabel">Konuş</span>

  </div>
  <div class="status">
    <span id="status">Konuşma tanıma hazır.</span>
    <span class="row" style="gap:8px">
      <select id="lang" aria-label="Konuşma dili"></select>
      <button type="button" class="link" id="clear">Metni temizle</button>
    </span>
  </div>
  <div class="voice" id="voice"></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section id="panel" role="tabpanel"></section>
</div>

<div class="bar"><div class="inner">
  <button class="btn primary" id="share" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg>
    PNG gönder
  </button>
  <button class="btn ghost" id="download" type="button">İndir</button>
  <button class="btn ghost" id="keep" type="button">Kaydet</button>
</div></div>
<div class="toast" id="toast" role="status"></div>

const IMGS={},IMG_PREFIX='sniImg:',pendingImgs=new Set();
function measureImg(im){
  try{const t=document.createElement('canvas');t.width=t.height=24;const x=t.getContext('2d');x.drawImage(im,0,0,24,24);
    const d=x.getImageData(0,0,24,24).data;let s=0,n=0,alpha=false;
    for(let i=0;i<d.length;i+=4){if(d[i+3]<250)alpha=true;if(d[i+3]<20)continue;s+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;n++;}
    return{lum:n?s/n:.5,alpha};}catch(e){return null;}
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();if(/^https?:/i.test(src))i.crossOrigin='anonymous';
  i.onload=()=>res(i);i.onerror=()=>rej(new Error('load'));i.src=src;setTimeout(()=>rej(new Error('load')),25000);});}
async function registerImage(key,src){
  let im;try{im=await loadImg(src);}catch(e){if(/^https?:/i.test(src))throw new Error('cors');throw e;}
  const m=measureImg(im);if(!m)throw new Error('cors');
  IMGS[key]={img:im,lum:m.lum,alpha:m.alpha};exportKey='';return key;
}
async function addDataImage(data){
  const key='d:'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await registerImage(key,data);
  try{localStorage.setItem(IMG_PREFIX+key,data);}catch(e){toast('Görsel bu cihazda kalıcı saklanamadı; sayfa kapanınca kaybolur.');}

}
async function addUrlImage(url){const key='u:'+url;if(!IMGS[key])await registerImage(key,url);return key;}

function layerBox(l,W,im){const asp=l.shape==='circle'||l.shape==='heart'?1:l.shape==='arch'?1.3:im.naturalHeight/im.naturalWidth;const w=l.w*W;return{w,h:w*asp};}
function shapePath(c,shape,w,h){
  const x=-w/2,y=-h/2;
  if(shape==='round'){rr(c,x,y,w,h,Math.min(w,h)*.1);return;}
  c.beginPath();
  if(shape==='circle')c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);
  else if(shape==='arch'){c.moveTo(x,y+h);c.lineTo(x,y+w/2);c.arc(0,y+w/2,w/2,Math.PI,0);c.lineTo(x+w,y+h);c.closePath();}
  else if(shape==='heart'){c.moveTo(0,y+h*.3);c.bezierCurveTo(0,y,x,y,x,y+h*.3);c.bezierCurveTo(x,y+h*.6,0,y+h*.78,0,y+h);c.bezierCurveTo(0,y+h*.78,x+w,y+h*.6,x+w,y+h*.3);c.bezierCurveTo(x+w,y,0,y,0,y+h*.3);c.closePath();}
  else c.rect(x,y,w,h);
}
function drawLayers(c,st,W,H,opt){
  const mn=Math.min(W,H);
  for(const l of st.layers||[]){
    const im=imgOf(l.img);if(!im)continue;
    const{w,h}=layerBox(l,W,im),bd=l.shape==='free'?0:l.border;
    c.save();c.translate(l.x*W,l.y*H);c.rotate(l.rot*Math.PI/180);c.globalAlpha=l.opacity/100;
    if(l.shape==='free'){
      if(l.shadow){c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=mn*.025;c.shadowOffsetY=mn*.01;}
      if(l.flip)c.scale(-1,1);
      c.drawImage(im,-w/2,-h/2,w,h);
    }else{
      if(bd||(l.shadow&&l.opacity>=100)){c.save();if(l.shadow){c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=mn*.03;c.shadowOffsetY=mn*.012;}
        shapePath(c,l.shape,w+bd*2,h+bd*2);c.fillStyle=bd?l.borderColor:'#000';c.fill();c.restore();}
      c.save();shapePath(c,l.shape,w,h);c.clip();if(l.flip)c.scale(-1,1);
      const s=Math.max(w/im.naturalWidth,h/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;
      c.drawImage(im,-dw/2,-dh/2,dw,dh);c.restore();
    }
    if(opt.preview&&opt.sel===l.id){c.globalAlpha=1;c.shadowColor='transparent';c.setLineDash([14,10]);c.lineWidth=5;c.strokeStyle='#0E6B6A';
      c.strokeRect(-w/2-bd-10,-h/2-bd-10,w+bd*2+20,h+bd*2+20);c.setLineDash([]);c.strokeStyle='#FFFFFF';c.lineWidth=2;c.strokeRect(-w/2-bd-14,-h/2-bd-14,w+bd*2+28,h+bd*2+28);}
    c.restore();
  }
}
function drawCredits(c,st,W,H){
  if(!st.showCredit)return;
  const list=[st.bg.mode==='image'&&imgOf(st.bg.img)?st.bg.credit:'',...(st.layers||[]).filter(l=>imgOf(l.img)).map(l=>l.credit)].filter(Boolean);
  if(!list.length)return;
  const full='Görsel: '+[...new Set(list)].join(' | '),fs=Math.max(13,Math.min(W,H)*.017);
  c.save();c.font=`600 ${fs}px Nunito, sans-serif`;c.textAlign='left';c.textBaseline='middle';
  let s=full;while(c.measureText(s).width>W*.9&&s.length>12)s=s.slice(0,-2);if(s!==full)s=s.slice(0,-1)+'…';
  const tw=c.measureText(s).width,bh=fs*1.6;
  c.fillStyle='rgba(0,0,0,.45)';rr(c,8,H-bh-8,tw+fs*.9,bh,fs*.45);c.fill();
  c.fillStyle='#FFFFFF';c.fillText(s,8+fs*.45,H-8-bh/2);c.restore();

/* =================== YARDIMCILAR =================== */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexRgb(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function lum(h){const[r,g,b]=hexRgb(h);return(.2126*r+.7152*g+.0722*b)/255;}
function rgba(h,a){const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`;}
function shade(h,amt){const[r,g,b]=hexRgb(h);const f=v=>Math.round(amt<0?v*(1+amt):v+(255-v)*amt);return`rgb(${f(r)},${f(g)},${f(b)})`;}
const contrast=h=>lum(h)>.5?'#1B1B1B':'#FFFFFF';
const fontOf=n=>FONTS.find(x=>x.f===n)||FONTS[0];
const fontCss=(F,size)=>`${F.w} ${size}px "${F.f}", ${/el yazısı/.test(F.c)?'cursive':'sans-serif'}`;
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const segmenter=window.Intl&&Intl.Segmenter?new Intl.Segmenter('tr',{granularity:'grapheme'}):null;
const graphemes=s=>(segmenter?[...segmenter.segment(s)].map(x=>x.segment):Array.from(s)).filter(x=>x.trim());
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ln(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function dims(st){const r=RATIOS.find(x=>x[0]===st.ratio)||RATIOS[0];return[r[2],r[3]];}
function gradColors(st){return st.bg.grad.filter(Boolean);}
function isDarkBg(st){
  const b=st.bg;
  if(b.mode==='transparent')return false;
  if(b.mode==='image'&&IMGS[b.img])return IMGS[b.img].lum*(1-b.dim/100)<.5;
  if(b.mode==='grad'){const g=gradColors(st);return g.reduce((s,c)=>s+lum(c),0)/g.length<.5;}
  return lum(b.solid)<.5;
}
const textColorOf=(st,dark)=>st.textColor==='auto'?(dark?'#FFFFFF':'#2A1B2E'):st.textColor;
function fmtDate(f){const d=new Date();
  if(f==='short')return d.toLocaleDateString('tr-TR');
  if(f==='weekday')return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'});
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});}

function heart(c,x,y,s,rot){c.save();c.translate(x,y);c.rotate(rot);c.beginPath();c.moveTo(0,s*.35);c.bezierCurveTo(-s*1.2,-s*.4,-s*.5,-s*1.2,0,-s*.45);c.bezierCurveTo(s*.5,-s*1.2,s*1.2,-s*.4,0,s*.35);c.fill();c.restore();}
function star(c,x,y,r,rot){c.save();c.translate(x,y);c.rotate(rot);c.beginPath();for(let i=0;i<10;i++){const rr2=i%2?r*.45:r,a=i*Math.PI/5;c.lineTo(Math.sin(a)*rr2,-Math.cos(a)*rr2);}c.closePath();c.fill();c.restore();}
function flower(c,x,y,r){c.save();c.translate(x,y);for(let i=0;i<5;i++){c.rotate(Math.PI*2/5);c.beginPath();c.ellipse(0,-r,r*.55,r*.9,0,0,7);c.fill();}c.globalCompositeOperation='destination-out';c.beginPath();c.arc(0,0,r*.45,0,7);c.fill();c.restore();}
const area=(W,H,U)=>W*H/(U*U);

  hstripes:{n:'Yatay şerit',d(c,W,H,col,U){c.fillStyle=col;const s=U/9;for(let y=0;y<H;y+=s)c.fillRect(0,y,W,s*.42);}},
  vstripes:{n:'Dikey şerit',d(c,W,H,col,U){c.fillStyle=col;const s=U/9;for(let x=0;x<W;x+=s)c.fillRect(x,0,s*.42,H);}},

  lined:{n:'Defter',d(c,W,H,col,U){c.strokeStyle=col;c.lineWidth=Math.max(1,U/300);const s=U/16;for(let y=s*1.5;y<H;y+=s)ln(c,0,y,W,y);c.strokeStyle='rgba(220,60,60,.5)';c.lineWidth=U/360;ln(c,W*.1,0,W*.1,H);}},
  checker:{n:'Damalı',d(c,W,H,col,U){c.fillStyle=col;const s=U/10;for(let y=0,i=0;y<H;y+=s,i++)for(let x=0,j=0;x<W;x+=s,j++)if((i+j)%2===0)c.fillRect(x,y,s,s);}},
  plaid:{n:'Ekose',d(c,W,H,col,U){c.fillStyle=col;const s=U/6;for(let x=0;x<W;x+=s)c.fillRect(x,0,s*.35,H);for(let y=0;y<H;y+=s)c.fillRect(0,y,W,s*.35);c.strokeStyle=col;c.lineWidth=U/400;for(let x=s*.7;x<W;x+=s)ln(c,x,0,x,H);for(let y=s*.7;y<H;y+=s)ln(c,0,y,W,y);}},
  triangles:{n:'Üçgen',d(c,W,H,col,U){c.fillStyle=col;const s=U/9,h=s*.866;for(let y=0,r=0;y<H+h;y+=h,r++)for(let x=-s+(r%2)*s/2;x<W+s;x+=s){c.beginPath();c.moveTo(x,y+h);c.lineTo(x+s/2,y);c.lineTo(x+s,y+h);c.closePath();c.fill();}}},
  diamonds:{n:'Baklava',d(c,W,H,col,U){c.strokeStyle=col;c.lineWidth=U/200;const s=U/8;for(let y=0,r=0;y<H+s;y+=s/2,r++)for(let x=(r%2)*s/2;x<W+s;x+=s){c.beginPath();c.moveTo(x,y-s/2);c.lineTo(x+s/2,y);c.lineTo(x,y+s/2);c.lineTo(x-s/2,y);c.closePath();c.stroke();}}},
  hexagon:{n:'Petek',d(c,W,H,col,U){c.strokeStyle=col;c.lineWidth=U/250;const r=U/20,w=Math.sqrt(3)*r,h=1.5*r;for(let y=0,row=0;y<H+r;y+=h,row++)for(let x=(row%2)*w/2;x<W+w;x+=w){c.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();c.stroke();}}},
  scales:{n:'Balık pulu',d(c,W,H,col,U){c.strokeStyle=col;c.lineWidth=U/220;const r=U/14;for(let y=0,row=0;y<H+r;y+=r/2,row++)for(let x=(row%2)*r;x<W+r*2;x+=r*2){c.beginPath();c.arc(x,y,r,0,Math.PI);c.stroke();}}},
  plus:{n:'Artı',d(c,W,H,col,U){c.strokeStyle=col;c.lineWidth=U/140;c.lineCap='round';const s=U/10,a=s*.17;for(let y=s/2,r=0;y<H+s;y+=s/2,r++)for(let x=(r%2)*s/2;x<W+s;x+=s){ln(c,x-a,y,x+a,y);ln(c,x,y-a,x,y+a);}}},
  hearts:{n:'Kalpler',d(c,W,H,col,U){c.fillStyle=col;const s=U/7;let r=0;for(let y=s/2;y<H+s;y+=s,r++)for(let x=(r%2)*s/2;x<W+s;x+=s)heart(c,x,y,s*.32,(r%3-1)*.25);}},
  stars:{n:'Yıldızlar',d(c,W,H,col,U){c.fillStyle=col;const rnd=rng(7),n=Math.round(area(W,H,U)*72);for(let i=0;i<n;i++)star(c,rnd()*W,rnd()*H,U/80+rnd()*U/40,rnd()*Math.PI);}},
  flowers:{n:'Çiçekler',d(c,W,H,col,U){c.fillStyle=col;const s=U/6;let r=0;for(let y=s/2;y<H+s;y+=s,r++)for(let x=(r%2)*s/2;x<W+s;x+=s)flower(c,x,y,s*.22);}},
  leaves:{n:'Yapraklar',d(c,W,H,col,U){c.fillStyle=col;c.strokeStyle=col;const rnd=rng(21),n=Math.round(area(W,H,U)*40);for(let i=0;i<n;i++){const s=U/40+rnd()*U/30;c.save();c.translate(rnd()*W,rnd()*H);c.rotate(rnd()*7);c.beginPath();c.ellipse(0,0,s*.45,s,0,0,7);c.fill();c.restore();}}},
  waves:{n:'Dalgalı',d(c,W,H,col,U){c.strokeStyle=col;c.lineWidth=U/150;const s=U/14;for(let y=0;y<H+s;y+=s){c.beginPath();for(let x=0;x<=W;x+=8)c.lineTo(x,y+Math.sin(x/U*Math.PI*6)*s*.3);c.stroke();}}},
  zigzag:{n:'Zikzak',d(c,W,H,col,U){c.strokeStyle=col;c.lineWidth=U/120;const s=U/12;for(let y=0;y<H+s;y+=s){c.beginPath();for(let x=0,i=0;x<=W+s;x+=s/2,i++)c.lineTo(x,y+(i%2?s*.3:0));c.stroke();}}},
  bubbles:{n:'Baloncuk',d(c,W,H,col,U){c.strokeStyle=col;c.fillStyle=col;const rnd=rng(3),n=Math.round(area(W,H,U)*55);c.lineWidth=U/300;for(let i=0;i<n;i++){const r=U/90+rnd()*U/14;c.beginPath();c.arc(rnd()*W,rnd()*H,r,0,7);rnd()<.4?c.fill():c.stroke();}}},
  snow:{n:'Kar tanesi',d(c,W,H,col,U){c.strokeStyle=col;c.lineCap='round';const rnd=rng(9),n=Math.round(area(W,H,U)*45);for(let i=0;i<n;i++){const r=U/60+rnd()*U/35;c.lineWidth=r/6;c.save();c.translate(rnd()*W,rnd()*H);c.rotate(rnd());for(let k=0;k<6;k++){c.rotate(Math.PI/3);ln(c,0,0,0,-r);ln(c,0,-r*.55,-r*.25,-r*.8);ln(c,0,-r*.55,r*.25,-r*.8);}c.restore();}}},
  notes:{n:'Nota',d(c,W,H,col,U){c.fillStyle=col;c.textAlign='center';c.textBaseline='middle';const rnd=rng(15),n=Math.round(area(W,H,U)*40),g=['♪','♫','♬','♩'];for(let i=0;i<n;i++){c.save();c.translate(rnd()*W,rnd()*H);c.rotate((rnd()-.5)*.8);c.font=`${Math.round(U/22+rnd()*U/18)}px serif`;c.fillText(g[i%4],0,0);c.restore();}}},
  sunburst:{n:'Işın',d(c,W,H,col){c.fillStyle=col;const R=Math.hypot(W,H),n=28;for(let i=0;i<n;i+=2){const a1=i/n*Math.PI*2,a2=(i+1)/n*Math.PI*2;c.beginPath();c.moveTo(W/2,H/2);c.arc(W/2,H/2,R,a1,a2);c.closePath();c.fill();}}},
  terrazzo:{n:'Mozaik',d(c,W,H,col,U){c.fillStyle=col;const rnd=rng(33),n=Math.round(area(W,H,U)*90);for(let i=0;i<n;i++){const x=rnd()*W,y=rnd()*H,s=U/80+rnd()*U/45,k=3+Math.floor(rnd()*3);c.beginPath();for(let j=0;j<k;j++){const a=j/k*7+rnd();c.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s);}c.closePath();c.fill();}}},
  confetti:{n:'Konfeti',d(c,W,H,col,U,a){const rnd=rng(11),cols=['#FF5E7E','#FFC145','#4CC9F0','#7BD389','#B388EB','#FF8C42'];c.globalAlpha=Math.min(1,a*3);for(let i=0,n=Math.round(area(W,H,U)*160);i<n;i++){c.save();c.fillStyle=cols[i%cols.length];c.translate(rnd()*W,rnd()*H);c.rotate(rnd()*6);const s=U/90+rnd()*U/90;if(rnd()<.5)c.fillRect(-s,-s/3,s*2,s*.7);else{c.beginPath();c.arc(0,0,s*.6,0,7);c.fill();}c.restore();}}},
};

/* =================== ÇERÇEVELER =================== */
const FRAMES={none:'Yok',line:'İnce çizgi',double:'Çift çizgi',dashed:'Kesik çizgi',dotted:'Noktalı',rounded:'Oval köşe',stitch:'Dikiş',
  corners:'Köşeler',ornament:'Süslü köşe',polaroid:'Polaroid',thick:'Kalın kenar',lace:'Dantel',tape:'Bant'};
function drawFrame(c,st,W,H,tcol){
  const f=st.frame,w=f.width,mn=Math.min(W,H),m=mn*.035,all=v=>({t:v,r:v,b:v,l:v});
  const col=f.color!=='auto'?f.color:f.style==='polaroid'?'#FFFFFF':f.style==='tape'?'#F7B6CF':f.style==='thick'?shade(tcol,0):tcol;
  let ins=all(0);
  c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=w;
  switch(f.style){
    case'line':c.strokeRect(m,m,W-2*m,H-2*m);ins=all(m+w);break;
    case'double':{c.strokeRect(m,m,W-2*m,H-2*m);const g=m+w*2.6;c.lineWidth=Math.max(1,w/2);c.strokeRect(g,g,W-2*g,H-2*g);ins=all(g);break;}
    case'dashed':c.setLineDash([w*4,w*2.5]);c.strokeRect(m,m,W-2*m,H-2*m);ins=all(m+w);break;
    case'dotted':c.lineCap='round';c.lineWidth=w*1.6;c.setLineDash([.01,w*3.5]);c.strokeRect(m,m,W-2*m,H-2*m);ins=all(m+w);break;
    case'rounded':rr(c,m,m,W-2*m,H-2*m,mn*.07);c.stroke();ins=all(m+w);break;
    case'stitch':c.setLineDash([w*3,w*2]);c.lineWidth=Math.max(2,w*.6);rr(c,m*1.4,m*1.4,W-2.8*m,H-2.8*m,mn*.04);c.stroke();ins=all(m*1.4+w);break;
    case'corners':{const L=mn*.14;c.lineCap='square';[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{c.beginPath();c.moveTo(x,y+sy*L);c.lineTo(x,y);c.lineTo(x+sx*L,y);c.stroke();c.beginPath();c.arc(x+sx*w*3,y+sy*w*3,w*.9,0,7);c.fill();});ins=all(m);break;}
    case'ornament':{const L=mn*.16;[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{c.save();c.translate(x,y);c.scale(sx,sy);c.lineWidth=w*.7;
      c.beginPath();c.moveTo(0,L);c.lineTo(0,0);c.lineTo(L,0);c.stroke();c.beginPath();c.arc(0,0,L*.42,0,Math.PI/2);c.stroke();c.beginPath();c.arc(0,0,L*.62,.15,Math.PI/2-.15);c.stroke();
      c.beginPath();c.arc(L*.17,L*.17,w*1.4,0,7);c.fill();c.beginPath();c.arc(L,0,w*1.1,0,7);c.arc(0,L,w*1.1,0,7);c.fill();c.restore();});ins=all(m+w);break;}
    case'polaroid':{const s=mn*.055,bb=mn*.16;c.beginPath();c.rect(0,0,W,H);c.rect(s,s,W-2*s,H-s-bb);c.fill('evenodd');c.strokeStyle='rgba(0,0,0,.08)';c.lineWidth=2;c.strokeRect(s,s,W-2*s,H-s-bb);ins={t:s,r:s,b:bb,l:s};break;}
    case'thick':{const s=w*5;c.beginPath();c.rect(0,0,W,H);c.rect(s,s,W-2*s,H-2*s);c.fill('evenodd');c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=3;c.strokeRect(s,s,W-2*s,H-2*s);ins=all(s);break;}
    case'lace':{const r=w*2.6,st2=r*1.9;for(let x=0;x<=W+r;x+=st2){c.beginPath();c.arc(x,0,r,0,7);c.arc(x,H,r,0,7);c.fill();}for(let y=0;y<=H+r;y+=st2){c.beginPath();c.arc(0,y,r,0,7);c.arc(W,y,r,0,7);c.fill();}ins=all(r*1.2);break;}
    case'tape':{const tw=mn*.28,th=mn*.075;[[tw*.32,th*1.0,-.7],[W-tw*.32,th*1.0,.7]].forEach(([x,y,a])=>{c.save();c.translate(x,y);c.rotate(a);c.globalAlpha=.85;c.fillStyle=col;c.fillRect(-tw/2,-th/2,tw,th);c.globalAlpha=.3;c.fillStyle='#FFFFFF';for(let i=-tw/2;i<tw/2;i+=th*.5)c.fillRect(i,-th/2,th*.22,th);c.restore();});break;}
  }
  c.restore();return ins;
}

/* =================== ÇİZİM =================== */
const DECO_LAYOUTS=[['none','Yok'],['corners','Köşeler'],['top','Üstte'],['bottom','Altta'],['topBig','Üstte büyük'],['sides','Yanlarda'],['scatter','Serpiştir']];
function drawDeco(c,st,W,H,ins){
  const em=st.deco.emojis,L=st.deco.layout,S=st.deco.size;if(!em.length||L==='none')return;
  c.save();c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';c.shadowColor='rgba(0,0,0,.18)';c.shadowBlur=S*.12;c.shadowOffsetY=S*.04;
  const put=(e,x,y,s,r=0)=>{c.save();c.translate(x,y);c.rotate(r);c.font=`${Math.round(s)}px ${EMOJI_FONT}`;c.fillText(e,0,0);c.restore();};
  const n=em.length,e=i=>em[i%n];
  if(L==='corners'){const d=S*.85;[[ins.l+d,ins.t+d,-.25],[W-ins.r-d,ins.t+d,.25],[ins.l+d,H-ins.b-d,.25],[W-ins.r-d,H-ins.b-d,-.25]].forEach((p,i)=>put(e(i),p[0],p[1],S,p[2]));}
  else if(L==='top'||L==='bottom'){const y=L==='top'?ins.t+S*.95:H-ins.b-S*.95;for(let i=0;i<3;i++)put(e(i),W/2+(i-1)*S*1.35,y,i===1?S*1.15:S*.9);}
  else if(L==='topBig')put(e(0),W/2,ins.t+S*1.25,S*1.8);
  else if(L==='sides'){for(let y=ins.t+S,i=0;y<H-ins.b-S*.5;y+=S*1.5,i++){put(e(i),ins.l+S*.75,y,S*.8,-.15);put(e(i+1),W-ins.r-S*.75,y,S*.8,.15);}}
  else if(L==='scatter'){const rnd=rng(5),band=S*1.3;for(let i=0;i<16;i++){const side=i%4,t=rnd();let x,y;
    if(side===0){x=ins.l+t*(W-ins.l-ins.r);y=ins.t+rnd()*band;}else if(side===1){x=ins.l+t*(W-ins.l-ins.r);y=H-ins.b-rnd()*band;}
    else if(side===2){x=ins.l+rnd()*band;y=ins.t+t*(H-ins.t-ins.b);}else{x=W-ins.r-rnd()*band;y=ins.t+t*(H-ins.t-ins.b);}
    put(e(i),x,y,S*(.5+rnd()*.5),(rnd()-.5)*.8);}}
  c.restore();
}
function decoReserve(st){const S=st.deco.size,L=st.deco.layout,r={t:0,b:0,l:0,r:0};if(!st.deco.emojis.length)return r;
  if(L==='top')r.t=S*1.6;if(L==='bottom')r.b=S*1.6;if(L==='topBig')r.t=S*2.3;if(L==='sides'){r.l=S*1.3;r.r=S*1.3;}return r;}

function wrapLines(c,text,maxW){
  const out=[];
  for(const para of text.split('\n')){
    if(!para.trim()){out.push('');continue;}
    let line='';
    for(const word of para.split(/\s+/).filter(Boolean)){
      const test=line?line+' '+word:word;
      if(c.measureText(test).width<=maxW||!line)line=test;else{out.push(line);line=word;}
    }
    out.push(line);
  }
  return out;
}

function paintBg(c,st,W,H,q){
  const b=st.bg;
  if(b.mode==='transparent')return;
  const bgIm=b.mode==='image'?imgOf(b.img):null;
  if(bgIm){
    const iw=bgIm.naturalWidth,ih=bgIm.naturalHeight,ex=b.blur*2,s=Math.max((W+ex*2)/iw,(H+ex*2)/ih),dw=iw*s,dh=ih*s;
    c.save();if(b.blur>0&&'filter'in c)c.filter=`blur(${b.blur*q}px)`;c.drawImage(bgIm,(W-dw)/2,(H-dh)/2,dw,dh);c.restore();
    if(b.dim>0){c.fillStyle=`rgba(0,0,0,${b.dim/100})`;c.fillRect(0,0,W,H);}
    return;
  }
  if(b.mode==='grad'){
    const cols=gradColors(st);let g;
    if(b.gradType==='radial')g=c.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.hypot(W,H)/2);
    else{const a=(b.angle-90)*Math.PI/180,r=Math.abs(W/2*Math.cos(a))+Math.abs(H/2*Math.sin(a));g=c.createLinearGradient(W/2-Math.cos(a)*r,H/2-Math.sin(a)*r,W/2+Math.cos(a)*r,H/2+Math.sin(a)*r);}
    cols.forEach((col,i)=>g.addColorStop(cols.length===1?0:i/(cols.length-1),col));c.fillStyle=g;
  }else c.fillStyle=b.solid;
  c.fillRect(0,0,W,H);
}

/* ---- hareket: parçacıklar ve yazı animasyonları ---- */
const PARTICLES=[['none','Yok'],['confetti','Konfeti'],['hearts','Uçan kalpler'],['stars','Parıltı'],['snow','Kar yağışı'],['bubbles','Baloncuk'],['petals','Çiçek yaprağı'],['emoji','Seçili emojiler']];
const TEXT_ANIMS=[['none','Yok'],['type','Daktilo'],['fade','Belirme'],['slide','Kayarak gelme'],['pop','Zıplama'],['pulse','Nabız']];
const BG_ANIMS=[['none','Sabit'],['zoom','Yavaş yakınlaşma']];
function drawParticles(c,st,W,H,t,dur){
  const kind=st.anim.particles,ph=t/dur,rnd=rng(77),U=Math.min(W,H),TAU=Math.PI*2;
  const n=kind==='stars'?60:kind==='emoji'?18:kind==='confetti'?70:45;
  const cols=['#FF5E7E','#FFC145','#4CC9F0','#7BD389','#B388EB','#FF8C42'];
  const ems=st.deco.emojis.length?st.deco.emojis:['❤️','✨'];
  c.save();
  for(let i=0;i<n;i++){
    const x0=rnd(),y0=rnd(),sp=1+Math.floor(rnd()*2),sw=rnd()*TAU,sz=rnd(),rot=rnd()*6;
    const fall=(y0+ph*sp)%1,rise=((y0-ph*sp)%1+1)%1,sway=Math.sin(ph*TAU*sp+sw);
    c.save();c.globalAlpha=1;
    switch(kind){
      case'confetti':{const s=U*(.009+sz*.011);c.translate(x0*W+sway*U*.03,fall*(H+80)-40);c.rotate(rot+ph*TAU*sp);c.fillStyle=cols[i%6];
        if(i%3)c.fillRect(-s,-s*.4,s*2,s*.8);else{c.beginPath();c.arc(0,0,s*.6,0,TAU);c.fill();}break;}
      case'hearts':c.globalAlpha=.85;c.fillStyle=['#FF4D6D','#FF8FA3','#FFFFFF','#E5383B'][i%4];heart(c,x0*W+sway*U*.04,rise*(H+100)-50,U*(.018+sz*.022),sway*.3);break;
      case'stars':c.globalAlpha=.25+.75*(.5+.5*Math.sin(ph*TAU*sp+sw));c.fillStyle='#FFF6C2';c.shadowColor='#FFF6C2';c.shadowBlur=U*.01;star(c,x0*W,y0*H,U*(.007+sz*.013),rot);break;
      case'snow':c.globalAlpha=.9;c.fillStyle='#FFFFFF';c.beginPath();c.arc(x0*W+sway*U*.025,fall*(H+40)-20,U*(.004+sz*.008),0,TAU);c.fill();break;
      case'bubbles':c.globalAlpha=.7;c.strokeStyle='#FFFFFF';c.lineWidth=U*.003;c.beginPath();c.arc(x0*W+sway*U*.03,rise*(H+120)-60,U*(.01+sz*.028),0,TAU);c.stroke();break;
      case'petals':c.globalAlpha=.9;c.fillStyle=['#FFB7C5','#FFC8DD','#FF8FAB'][i%3];c.translate(x0*W+sway*U*.05,fall*(H+60)-30);c.rotate(rot+ph*TAU*sp);
        c.beginPath();c.ellipse(0,0,U*(.007+sz*.006),U*(.013+sz*.01),0,0,TAU);c.fill();break;
      case'emoji':c.font=`${Math.round(U*(.035+sz*.04))}px ${EMOJI_FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';
        c.translate(x0*W+sway*U*.04,rise*(H+140)-70);c.rotate(sway*.25);c.fillText(ems[i%ems.length],0,0);break;
    }
    c.restore();
  }
  c.restore();
}
const easeOut=x=>1-Math.pow(1-x,3);
const backOut=x=>{const k=1.70158;return 1+(k+1)*Math.pow(x-1,3)+k*Math.pow(x-1,2);};
const isRTL=s=>/[֐-ࣿ]/.test(s);

function drawEffectText(c,l,x,y,size,effect,ec,k,fill,baseCol){
  c.save();
  switch(effect){
    case'shadow':c.shadowColor=ec?rgba(ec,.75):'rgba(0,0,0,.4)';c.shadowBlur=size*.22*k;c.shadowOffsetY=size*.07*k;break;
    case'outline':c.lineJoin='round';c.lineWidth=size*.14*k;c.strokeStyle=ec||contrast(baseCol);c.strokeText(l,x,y);break;
    case'double':c.lineJoin='round';c.lineWidth=size*.3*k;c.strokeStyle=ec||baseCol;c.strokeText(l,x,y);c.lineWidth=size*.15*k;c.strokeStyle=contrast(baseCol);c.strokeText(l,x,y);break;
    case'neon':c.shadowColor=ec||baseCol;c.shadowBlur=size*.55*k;c.fillStyle=fill;c.fillText(l,x,y);c.fillText(l,x,y);c.shadowBlur=size*.15*k;break;
    case'3d':{const d=Math.max(1,Math.round(size*.08*k));c.fillStyle=ec||shade(baseCol,lum(baseCol)>.5?-.45:.45);for(let j=d;j>0;j--)c.fillText(l,x+j,y+j);break;}
    case'long':{const d=Math.round(size*.45*k);c.fillStyle=ec?rgba(ec,.12):'rgba(0,0,0,.08)';for(let j=d;j>0;j-=2)c.fillText(l,x+j,y+j);break;}
    case'glitch':{const o=size*.045*k;c.fillStyle='rgba(0,229,255,.85)';c.fillText(l,x-o,y);c.fillStyle='rgba(255,0,110,.85)';c.fillText(l,x+o,y);break;}
  }
  c.fillStyle=fill;c.fillText(l,x,y);
  c.restore();
}
function selOutline(c,x,y,w,h){c.save();c.globalAlpha=1;c.shadowColor='transparent';c.setLineDash([14,10]);c.lineWidth=5;c.strokeStyle='#0E6B6A';c.strokeRect(x,y,w,h);

const DUMMY=document.createElement('canvas').getContext('2d');
const lastBounds={main:null,texts:{}};

function draw(cv,st,q=1,opt={}){
  const[W,H]=dims(st);
  const pw=Math.max(1,Math.round(W*q)),ph=Math.max(1,Math.round(H*q));
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}
  const c=cv.getContext('2d');c.setTransform(q,0,0,q,0,0);c.clearRect(0,0,W,H);
  const dark=isDarkBg(st),tcol=textColorOf(st,dark),mn=Math.min(W,H);
  const A=st.anim,dur=A.dur,T=opt.t;
  const tPart=T===undefined?dur*.35:T%dur;
  const tText=T===undefined?null:(opt.once?Math.min(T,dur):T%dur);

  // taban: fon + desen + resimler (yavaş yakınlaşma bunlara uygulanır)
  c.save();
  if(A.bg==='zoom'&&T!==undefined){const z=1+.08*(.5-.5*Math.cos(Math.PI*2*tPart/dur));c.translate(W/2,H/2);c.scale(z,z);c.translate(-W/2,-H/2);}
  if(opt.base)c.drawImage(opt.base,0,0,W,H);
  else{
    paintBg(c,st,W,H,q);
    const pat=PATTERNS[st.pattern];
    if(pat&&st.pattern!=='none'){const a=st.patAlpha/100;const col=st.patColor==='auto'?(dark?`rgba(255,255,255,${a})`:`rgba(40,20,50,${a*.75})`):rgba(st.patColor,a);
      c.save();pat.d(c,W,H,col,1080*st.patScale,a);c.restore();}
    drawLayers(c,st,W,H,opt);
  }
  c.restore();
  if(opt.baseOnly)return;

  const ins=drawFrame(c,st,W,H,tcol);
  drawDeco(c,st,W,H,ins);
  if(opt.noText)return;
  if(A.particles!=='none')drawParticles(c,st,W,H,tPart,dur);

  // alt not ölçüleri
  const sg=st.sign,signText=[sg.text.trim(),sg.date?fmtDate(sg.dateFmt):''].filter(Boolean).join('  ·  ');
  const inPolaroid=st.frame.style==='polaroid'&&sg.pos==='bottom';
  const footH=signText&&!inPolaroid?sg.size*1.9:0;
  const res=decoReserve(st),pad=mn*.085;
  const ax=ins.l+pad+res.l,aw=W-ins.l-ins.r-pad*2-res.l-res.r;
  const ay=ins.t+pad+res.t+(sg.pos==='top'?footH:0),ah=H-ins.t-ins.b-pad*2-res.t-res.b-footH;

  // ana yazı
  const F=fontOf(st.font),lh=st.lineHeight;
  let text=(opt.sample||st.text||'').trim()||'Notunuz burada görünecek…';
  if(st.upper)text=text.toLocaleUpperCase(st.lang||'tr-TR');
  const hasLS='letterSpacing'in c;
  let size=st.size,lines,maxW;
  for(;;){
    c.font=fontCss(F,size);if(hasLS)c.letterSpacing=(st.letterSpacing*size/100)+'px';
    lines=wrapLines(c,text,aw);maxW=Math.max(...lines.map(l=>c.measureText(l).width));
    if((lines.length*size*lh<=ah&&maxW<=aw)||size<=16)break;
    size-=2;
  }
  const blockH=lines.length*size*lh;
  const cx=ax+aw/2,cy=ay+ah/2;
  const top0=st.valign==='top'?ay:st.valign==='bottom'?ay+ah-blockH:ay+(ah-blockH)/2;
  const x0=st.align==='center'?cx:st.align==='left'?ax:ax+aw;
  const bx0=st.align==='center'?cx-maxW/2:st.align==='left'?ax:ax+aw-maxW;
  const lineX=lw=>st.align==='center'?x0-lw/2:st.align==='left'?x0:x0-lw;
  const dx=(st.textDX||0)*W,dy=(st.textDY||0)*H,bcx=bx0+maxW/2,bcy=top0+blockH/2;

  // yazı animasyonu
  const P=tText===null?1:tText/dur;let alpha=1,scale=1,slide=0,reveal=1;
  switch(A.text){
    case'type':reveal=Math.min(1,P/.6);break;
    case'fade':alpha=Math.min(1,P/.35);break;
    case'slide':{const e=easeOut(Math.min(1,P/.35));alpha=e;slide=(1-e)*size*2;break;}
    case'pop':{const e=Math.min(1,P/.3);scale=Math.max(.01,backOut(e));alpha=Math.min(1,e*3);break;}
    case'pulse':scale=1+.04*Math.sin(Math.PI*2*(tText===null?0:tText/dur)*2);break;
  }
  if(tText===null){alpha=1;scale=1;slide=0;reveal=1;}

  c.save();
  c.translate(dx,dy+slide);
  c.translate(cx,cy);c.rotate(st.tilt*Math.PI/180);c.translate(-cx,-cy);
  if(scale!==1){c.translate(bcx,bcy);c.scale(scale,scale);c.translate(-bcx,-bcy);}
  c.globalAlpha=alpha;

  const B=st.box,bAlpha=B.opacity/100;
  if(B.style!=='none'){
    const bcol=B.color!=='auto'?B.color:B.style==='highlight'?(lum(tcol)>.5?'#000000':'#FFE066'):(lum(tcol)>.5?'#000000':'#FFFFFF');
    c.save();c.fillStyle=rgba(bcol,bAlpha);
    const cp=size*.55;
    if(B.style==='card'||B.style==='bubble'){
      const bx=bx0-cp,by=top0-cp*.6,bw=maxW+cp*2,bh=blockH+cp*1.2;
      c.shadowColor='rgba(0,0,0,.12)';c.shadowBlur=30;rr(c,bx,by,bw,bh,B.radius);c.fill();
      if(B.style==='bubble'){c.shadowBlur=0;c.beginPath();c.moveTo(bx+bw*.16,by+bh-1);c.lineTo(bx+bw*.1,by+bh+size*.7);c.lineTo(bx+bw*.32,by+bh-1);c.closePath();c.fill();}
    }else if(B.style==='band'){c.fillRect(ins.l-dx,top0-cp*.6,W-ins.l-ins.r,blockH+cp*1.2);}
    else if(B.style==='highlight'){lines.forEach((l,i)=>{if(!l)return;const lw=c.measureText(l).width,y=top0+size*lh*(i+.5);
      rr(c,lineX(lw)-size*.15,y-size*.2,lw+size*.3,size*.62,size*.12);c.fill();});}
    c.restore();
  }

  let fill=tcol;
  if(st.fill==='grad'){const g=c.createLinearGradient(0,top0,0,top0+blockH);g.addColorStop(0,st.textGrad[0]);g.addColorStop(1,st.textGrad[1]);fill=g;}
  else if(st.fill==='rainbow'){const g=c.createLinearGradient(bx0,0,bx0+maxW,0);RAINBOW.forEach((col,i)=>g.addColorStop(i/(RAINBOW.length-1),col));fill=g;}
  const baseCol=st.fill==='solid'?tcol:st.fill==='grad'?st.textGrad[0]:'#6A4C93';
  const ec=st.effectColor==='auto'?null:st.effectColor,k=st.effectSize/50;

  c.textAlign='left';c.textBaseline='middle';c.direction=isRTL(text)?'rtl':'ltr';
  if(c.direction==='rtl')c.textAlign='right';
  const total=lines.reduce((s,l)=>s+Array.from(l).length,0);let left=Math.floor(total*reveal+.0001);
  lines.forEach((l,i)=>{
    if(!l||left<=0)return;
    const chars=Array.from(l),show=chars.length<=left?l:chars.slice(0,left).join('');left-=chars.length;
    const lw=c.measureText(l).width,lx=lineX(lw),y=top0+size*lh*(i+.5);
    drawEffectText(c,show,c.direction==='rtl'?lx+lw:lx,y,size,st.effect,ec,k,fill,baseCol);
  });
  if(opt.preview){
    lastBounds.main={cx:bcx+dx,cy:bcy+dy,w:maxW+size*.6,h:blockH+size*.3,rot:st.tilt,pivot:{x:cx+dx,y:cy+dy}};
    if(opt.selText==='main')selOutline(c,bx0-size*.3,top0-size*.15,maxW+size*.6,blockH+size*.3);
  }
  c.restore();
  if(hasLS)c.letterSpacing='0px';
  c.direction='ltr';

  // ek yazılar
  for(const tx of st.texts||[]){
    const TF=fontOf(tx.font||st.font),ts=tx.size,tl=(tx.text||'').split('\n');
    c.save();c.font=fontCss(TF,ts);c.textAlign='center';c.textBaseline='middle';c.direction=isRTL(tx.text||'')?'rtl':'ltr';
    const widths=tl.map(l=>c.measureText(l).width),tw=Math.max(10,...widths),th=tl.length*ts*1.2;
    const X=tx.x*W,Y=tx.y*H;
    c.translate(X,Y);c.rotate(tx.rot*Math.PI/180);c.globalAlpha=alpha;
    const col=tx.color==='auto'?tcol:tx.color;
    if(tx.box){c.save();c.fillStyle=rgba(tx.boxColor==='auto'?(lum(col)>.5?'#000000':'#FFFFFF'):tx.boxColor,.6);rr(c,-tw/2-ts*.4,-th/2-ts*.25,tw+ts*.8,th+ts*.5,ts*.3);c.fill();c.restore();}
    tl.forEach((l,i)=>{if(l)drawEffectText(c,l,0,-th/2+ts*1.2*(i+.5),ts,tx.effect,null,1,col,col);});
    if(opt.preview){
      lastBounds.texts[tx.id]={cx:X,cy:Y,w:tw+ts*.8,h:th+ts*.5,rot:tx.rot};
      if(opt.selText===tx.id)selOutline(c,-tw/2-ts*.45,-th/2-ts*.3,tw+ts*.9,th+ts*.6);
    }
    c.restore();
  }

  // alt not
  if(signText){
    const SF=fontOf(sg.font||st.font);let fs=sg.size;
    const dodge=!inPolaroid&&st.deco.emojis.length&&['corners','sides'].includes(st.deco.layout)?st.deco.size*1.7:0;
    const maxSW=W-ins.l-ins.r-pad*1.4-dodge*2;
    c.font=fontCss(SF,fs);while(c.measureText(signText).width>maxSW&&fs>12){fs-=1;c.font=fontCss(SF,fs);}
    const scol=sg.color!=='auto'?sg.color:inPolaroid?'#333333':tcol;
    c.textAlign=sg.align;c.textBaseline='middle';
    const sx=sg.align==='left'?ins.l+pad*.7+dodge:sg.align==='center'?W/2:W-ins.r-pad*.7-dodge;
    const sy=inPolaroid?H-ins.b/2:sg.pos==='top'?ins.t+pad*.55+fs*.6:H-ins.b-pad*.55-fs*.6;
    c.save();
    if(sg.effect==='shadow'){c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=fs*.25;c.shadowOffsetY=fs*.06;}
    if(sg.effect==='outline'){c.lineJoin='round';c.lineWidth=fs*.16;c.strokeStyle=contrast(scol);c.strokeText(signText,sx,sy);}
    if(sg.effect==='neon'){c.shadowColor=scol;c.shadowBlur=fs*.6;c.fillStyle=scol;c.fillText(signText,sx,sy);}
    c.fillStyle=scol;c.fillText(signText,sx,sy);
    c.restore();
  }
  drawCredits(c,st,W,H);
}

let raf=0,tIdle=0,exportBlob=null,exportKey='';
const keyOf=()=>JSON.stringify(state)+'|'+Object.keys(IMGS).length;

  cancelAnimationFrame(animRaf);animRaf=0;draw(canvas,state,1,previewOpts());}

}
async function makeBlob(){

  const b=await new Promise(r=>cv.toBlob(r,'image/png'));exportBlob=b;exportKey=key;return b;
}
let hist=[JSON.stringify(state)],hi=0;
function pushHist(){const s=JSON.stringify(state);if(s===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>80)hist.shift();hi=hist.length-1;updUndo();}

$('#redo').onclick=()=>{if(hi<hist.length-1){hi++;restore(hist[hi]);updUndo();}};
function afterLoad(record=true){ta.value=state.text;langSel.value=state.lang||'tr-TR';if(!state.layers.some(l=>l.id===selectedLayer))selectedLayer=null;if(selectedText&&selectedText!=='main'&&!state.texts.some(t=>t.id===selectedText))selectedText=null;ensureImages();updTouch();ensureFonts().then(()=>drawPreview());buildPanel(activeTab);changed();if(!record){clearTimeout(tIdle);tIdle=setTimeout(()=>{persist();makeBlob();},300);}}

function ensureFonts(st=state){
  const fs=[fontOf(st.font),fontOf(st.sign.font||st.font),...(st.texts||[]).map(t=>fontOf(t.font||st.font))];

function el(tag,attrs={},...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else if(k==='style')e.style.cssText=v;else if(k==='text')e.textContent=v;else e.setAttribute(k,v);}
  kids.flat().forEach(x=>x!=null&&e.append(x));return e;}
const getP=p=>p.split('.').reduce((o,k)=>o[k],state);
function setP(p,v){const ks=p.split('.');let o=state;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks[ks.length-1]]=v;changed();}

function field(label,node,out){return el('div',{class:'field'},el('div',{class:'label'},el('span',{text:label}),out||null),node);}

function colorRow(label,path,palette,{auto=false}={}){
  const box=el('div',{class:'swatches'}),cur=getP(path);
  if(auto){const b=el('button',{type:'button',class:'sw auto','aria-label':'Otomatik renk',title:'Otomatik','aria-pressed':String(cur==='auto')});b.onclick=()=>{setP(path,'auto');markIn(box,b);};box.append(b);}

  const lab=el('label',{class:'sw custom',title:'Özel renk','aria-pressed':String(isCustom)},isCustom?null:el('span',{text:'+'}),inp);

function tileGrid(items,onPick,size=150){

  state.pattern=Math.random()<.2?'none':pick(Object.keys(PATTERNS));state.patAlpha=12+Math.round(Math.random()*20);state.patScale=pick([.7,1,1,1.4]);state.patColor='auto';
  state.font=pick(FONTS).f;state.textColor='auto';state.fill=Math.random()<.12?'rainbow':'solid';
  state.effect=pick(['none','shadow','shadow','outline','neon','3d','double','long']);state.effectColor='auto';

let selectedLayer=null,selectedText=null,gest=null,moveRaf=0;const ptrs=new Map();

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);

    if(inBox({cx:l.x*W,cy:l.y*H,w:w+l.border*2,h:h+l.border*2,rot:l.rot},px,py))return l;}
  return null;}

// seçili nesneyi ve hangi alanlarının değişeceğini döndürür
function selObj(){

function select(kind,id){selectedLayer=kind==='layer'?id:null;selectedText=kind==='text'?id:null;}

function startGesture(){const s=selObj();if(!s){gest=null;return;}const p=[...ptrs.values()],[W,H]=dims(state),o=s.o;
  gest={s,x0:o[s.kx]||0,y0:o[s.ky]||0,s0:o[s.ks],r0:o[s.kr]||0,c0:center(p),d0:p.length>1?dist(p[0],p[1]):0,a0:p.length>1?ang(p[0],p[1]):0,W,H};}

  const p=toCv(e);

  o[s.kx]=clamp(g.x0+(c.x-g.c0.x)/g.W,lim[0],lim[1]);o[s.ky]=clamp(g.y0+(c.y-g.c0.y)/g.H,lim[0],lim[1]);

  rec.onerror=e=>{
    const m={'not-allowed':'Mikrofon izni verilmedi. Tarayıcı ayarlarından bu siteye mikrofon izni verin.','service-not-allowed':'Bu tarayıcıda konuşma tanıma kapalı.',
      'no-speech':'Ses algılanmadı, tekrar deneyin.','network':'Konuşma tanıma için internet bağlantısı gerekiyor.','audio-capture':'Mikrofon bulunamadı.',
      'language-not-supported':'Bu dil bu tarayıcıda desteklenmiyor; başka bir dil seçin.'}[e.error];
    if(m){$('#status').textContent=m;if(e.error!=='no-speech')stopListening(true);}
  };
  rec.onend=()=>{baseText=tidy(ta.value);if(listening){try{rec.start();}catch(_){stopListening();}}};
  rec.start();
}
function startListening(){
  if(!SR){toast('Bu tarayıcı sesle yazmayı desteklemiyor. Chrome veya Safari kullanın.');return;}
  if(voice.rec){toast('Önce sesli mesaj kaydını bitirin.');return;}
  baseText=ta.value.trim();listening=true;
  $('#mic').classList.add('on');$('#micLabel').textContent='Durdur';$('#status').textContent=`Dinliyorum… (${langName()})`;
  try{startRec();}catch(e){stopListening();toast('Mikrofon başlatılamadı.');}
}
function stopListening(keepMsg){
  listening=false;try{rec&&rec.stop();}catch(_){}
  $('#mic').classList.remove('on');$('#micLabel').textContent='Konuş';
  if(!keepMsg)$('#status').textContent='Kayıt durdu. Metni düzenleyebilirsiniz.';
}
$('#mic').onclick=()=>listening?stopListening():startListening();
// ek yazı alanına sesle yazma (tek seferlik)
function dictateInto(area,onText){
  if(!SR){toast('Bu tarayıcı sesle yazmayı desteklemiyor.');return;}
  if(listening)stopListening(true);
  const r=new SR();r.lang=state.lang||'tr-TR';r.interimResults=true;r.continuous=false;const base=area.value.trim()==='Yeni yazı'?'':area.value.trim();
  r.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;area.value=tidy(joinText(base,applyVoicePunct(s.trim())));onText(area.value);};
  r.onerror=()=>toast('Ses algılanamadı, tekrar deneyin.');r.onend=()=>{$('#status').textContent=`Konuşma dili: ${langName()}`;};
  try{r.start();$('#status').textContent='Ek yazı için dinliyorum…';}catch(e){toast('Mikrofon başlatılamadı.');}
}
if(!SR)$('#status').textContent='Bu tarayıcıda sesle yazma yok; Android’de Chrome, iPhone’da Safari kullanın.';
else if(location.protocol==='file:')$('#status').textContent='Mikrofon için sayfayı https adresinden açın.';
else $('#status').textContent=`Konuşma dili: ${langName()}`;

/* =================== SESLİ MESAJ KAYDI =================== */
const voice={rec:null,blob:null,url:'',t0:0,timer:0,send:true};
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const audioExt=t=>/mp4|m4a|aac/.test(t)?'m4a':/ogg/.test(t)?'ogg':/mpeg/.test(t)?'mp3':'webm';
async function toggleVoice(){
  if(voice.rec){voice.rec.stop();return;}
  if(listening)stopListening(true);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Bu tarayıcı ses kaydını desteklemiyor.');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){toast('Mikrofon izni verilmedi. Tarayıcı ayarlarından izin verin.');return;}
  const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const r=new MediaRecorder(stream,mime?{mimeType:mime}:{}),chunks=[];
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  r.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(voice.timer);voice.rec=null;
    const type=(r.mimeType||mime||'audio/webm').split(';')[0];voice.blob=new Blob(chunks,{type});
    if(voice.url)URL.revokeObjectURL(voice.url);voice.url=URL.createObjectURL(voice.blob);renderVoice();
    toast('Sesli mesaj hazır. Kartla birlikte ya da video olarak gönderebilirsiniz.');if(activeTab==='hareket')buildPanel('hareket');};
  r.start(250);voice.rec=r;voice.t0=Date.now();
  voice.timer=setInterval(()=>{if((Date.now()-voice.t0)/1000>=120)r.stop();else renderVoice();},250);
  renderVoice();
}
function renderVoice(){
  const box=$('#voice');box.innerHTML='';
  if(voice.rec){box.append(el('button',{type:'button',class:'vbtn rec',onclick:toggleVoice},el('i'),`Kaydı bitir ${mmss((Date.now()-voice.t0)/1000)}`),
    el('span',{class:'hint',text:'En fazla 2 dakika'}));return;}
  if(voice.blob){
    const chk=el('input',{type:'checkbox',id:'f_voice_send'});chk.checked=voice.send;chk.onchange=()=>{voice.send=chk.checked;};
    box.append(el('audio',{controls:'',src:voice.url,preload:'metadata'}),
      el('label',{class:'chk'},chk,'Kartla gönder'),
      el('button',{type:'button',class:'vbtn',text:'Yeniden kaydet',onclick:()=>{voice.blob=null;toggleVoice();}}),
      el('button',{type:'button',class:'link',style:'color:var(--rec)',text:'Sil',onclick:()=>{voice.blob=null;if(voice.url)URL.revokeObjectURL(voice.url);voice.url='';renderVoice();if(activeTab==='hareket')buildPanel('hareket');}}));
    return;}
  box.append(el('button',{type:'button',class:'vbtn',onclick:toggleVoice},el('i'),'Sesli mesaj kaydet'),
    el('span',{class:'hint',text:'Sesiniz kartla birlikte ya da sesli video olarak gönderilir.'}));
}

/* =================== HAREKETLİ KART: GIF ve VİDEO =================== */
let animRaf=0,animStart=0,previewBase=null,previewBaseKey='';
const animOn=(st=state)=>st.anim.particles!=='none'||st.anim.text!=='none'||st.anim.bg!=='none';
function previewOpts(){return{preview:true,sel:selectedLayer,selText:selectedText};}
function animTick(now){
  if(!animOn()){animRaf=0;draw(canvas,state,1,previewOpts());return;}
  const k=JSON.stringify(state)+'|'+selectedLayer+'|'+Object.keys(IMGS).length;
  if(k!==previewBaseKey){previewBase=previewBase||document.createElement('canvas');draw(previewBase,state,1,{baseOnly:true,preview:true,sel:selectedLayer});previewBaseKey=k;}
  draw(canvas,state,1,{...previewOpts(),base:previewBase,t:(now-animStart)/1000});
  animRaf=requestAnimationFrame(animTick);
}
function makeBase(q){const b=document.createElement('canvas');draw(b,state,q,{baseOnly:true});return b;}
let lastMedia=null,mediaBusy=false;
const even=n=>Math.max(2,Math.round(n/2)*2);
async function exportGif(onProg){
  const{GIFEncoder,quantize,applyPalette}=await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js');
  await ensureFonts();
  const[W,H]=dims(state),q=Math.min(1,480/Math.max(W,H)),fps=12,n=Math.round(state.anim.dur*fps);
  const cv=document.createElement('canvas'),base=makeBase(q),gif=GIFEncoder();
  for(let i=0;i<n;i++){
    draw(cv,state,q,{base,t:i/fps});
    const{data,width,height}=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height);
    const pal=quantize(data,256),idx=applyPalette(data,pal);
    gif.writeFrame(idx,width,height,{palette:pal,delay:Math.round(1000/fps)});
    onProg((i+1)/n);if(i%2===0)await new Promise(r=>setTimeout(r,0));
  }
  gif.finish();return new Blob([gif.bytes()],{type:'image/gif'});
}
async function exportVideo(withAudio,onProg){
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error('nosupport');
  await ensureFonts();
  const[W,H]=dims(state),q=Math.min(1,1280/Math.max(W,H));
  const cv=document.createElement('canvas');cv.width=even(W*q);cv.height=even(H*q);
  const qq=cv.width/W,base=makeBase(qq);draw(cv,state,qq,{base,t:0,once:true});
  const stream=cv.captureStream(30);let dur=state.anim.dur,ac=null,src=null;
  if(!animOn())dur=Math.min(dur,4);
  if(withAudio&&voice.blob){
    ac=new(window.AudioContext||window.webkitAudioContext)();
    const buf=await ac.decodeAudioData(await voice.blob.arrayBuffer());
    src=ac.createBufferSource();src.buffer=buf;const dest=ac.createMediaStreamDestination();src.connect(dest);
    stream.addTrack(dest.stream.getAudioTracks()[0]);dur=Math.max(dur,buf.duration+.5);
  }
  const types=['video/mp4;codecs="avc1.42E01E, mp4a.40.2"','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const r=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:5000000}:{}),chunks=[];
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  const stopped=new Promise(res=>r.onstop=res);
  r.start(250);if(src)src.start();const t0=performance.now();
  await new Promise(res=>{const tick=()=>{const t=(performance.now()-t0)/1000;draw(cv,state,qq,{base,t,once:true});onProg(Math.min(1,t/dur));
    if(t>=dur)res();else setTimeout(tick,33);};tick();});
  r.stop();await stopped;stream.getTracks().forEach(t=>t.stop());if(ac)ac.close();
  const type=(r.mimeType||mime||'video/webm').split(';')[0];
  return new Blob(chunks,{type});
}
const mediaExt=t=>t.includes('gif')?'gif':t.includes('mp4')?'mp4':'webm';
async function runExport(kind,withAudio){
  if(mediaBusy)return;mediaBusy=true;if(listening)stopListening(true);
  const bar=$('#mediaProg i'),msg=$('#mediaMsg');const prog=p=>{if(bar)bar.style.width=Math.round(p*100)+'%';};
  if(msg)msg.textContent=kind==='gif'?'GIF hazırlanıyor… Bu sayfada kalın.':'Video kaydediliyor… Bu sayfada kalın, ekranı kapatmayın.';
  try{
    const blob=kind==='gif'?await exportGif(prog):await exportVideo(withAudio,prog);
    if(lastMedia&&lastMedia.url)URL.revokeObjectURL(lastMedia.url);
    lastMedia={blob,url:URL.createObjectURL(blob),name:'not-'+Date.now().toString(36)+'.'+mediaExt(blob.type)};
    toast(kind==='gif'?'GIF hazır.':'Video hazır.');
  }catch(e){toast(e.message==='nosupport'?'Bu tarayıcı video kaydını desteklemiyor; GIF deneyin.':'Oluşturulamadı: '+(e.message||'bilinmeyen hata'));}
  mediaBusy=false;if(activeTab==='hareket')buildPanel('hareket');
}
async function shareMedia(){
  if(!lastMedia)return;const file=new File([lastMedia.blob],lastMedia.name,{type:lastMedia.blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});}catch(e){if(e.name!=='AbortError')downloadAs(lastMedia.blob,lastMedia.name);}}
  else{downloadAs(lastMedia.blob,lastMedia.name);toast('Bu tarayıcı doğrudan paylaşamıyor; dosya indirildi.');}
}

/* =================== PAYLAŞ / İNDİR / KOPYALA =================== */
const fileName=()=>'not-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.png';
function downloadAs(blob,name){const a=el('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
const download=blob=>downloadAs(blob,fileName());
$('#share').onclick=async()=>{
  if(listening)stopListening();
  const ready=exportBlob&&exportKey===keyOf();
  const blob=ready?exportBlob:await makeBlob();
  const file=new File([blob],fileName(),{type:'image/png'});
  let files=[file];
  if(voice.blob&&voice.send){const af=new File([voice.blob],'sesli-mesaj.'+audioExt(voice.blob.type),{type:voice.blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file,af]}))files=[file,af];else toast('Ses bu yolla eklenemedi; Hareket sekmesinden sesli video oluşturun.');}
  if(navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({files});}
    catch(e){if(e.name==='NotAllowedError')toast('Görsel hazır, tekrar dokunun.');else if(e.name!=='AbortError'){download(blob);toast('PNG indirildi.');}}
  }else{download(blob);toast('Bu tarayıcı doğrudan paylaşamıyor; PNG indirildi, mesaja ekleyebilirsiniz.');}
};
$('#download').onclick=async()=>{download(await makeBlob());toast('PNG indirildi.');};
async function copyImage(){
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':makeBlob()})]);toast('Görsel panoya kopyalandı.');}
  catch(e){toast('Bu tarayıcı görsel kopyalamayı desteklemiyor; İndir düğmesini kullanın.');}
}

/* =================== ARAYÜZ TEMASI =================== */
const ACCENTS={teal:['Deniz','#0E6B6A','#3FB3B0'],blue:['Mavi','#1D4ED8','#7AA2FF'],purple:['Mor','#6D28D9','#B794F6'],
  pink:['Pembe','#BE185D','#F472B6'],orange:['Turuncu','#C2410C','#FB923C'],green:['Yeşil','#15803D','#4ADE80'],gray:['Gri','#374151','#A3ACB9']};
let ui={theme:'system',accent:'teal'};
try{ui={...ui,...JSON.parse(localStorage.getItem('sesliNotUI')||'{}')};}catch(e){}
function applyUI(){
  const r=document.documentElement,a=ACCENTS[ui.accent]||ACCENTS.teal;
  if(ui.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',ui.theme);
  r.style.setProperty('--accent-l',a[1]);r.style.setProperty('--accent-d',a[2]);
  const dark=ui.theme==='dark'||(ui.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').setAttribute('content',dark?'#121918':a[1]);
  try{localStorage.setItem('sesliNotUI',JSON.stringify(ui));}catch(e){}
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyUI);

/* =================== UYGULAMA OLARAK YÜKLEME (PWA) =================== */
let installPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(activeTab==='ayar')buildPanel('ayar');});
window.addEventListener('appinstalled',()=>{installPrompt=null;toast('Uygulama yüklendi.');if(activeTab==='ayar')buildPanel('ayar');});
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});

applyUI();renderVoice();
buildTabs();buildPanel(activeTab);updUndo();updTouch();ensureImages();gcImages();
drawPreview();
ensureFonts().then(()=>{drawPreview();makeBlob();});
